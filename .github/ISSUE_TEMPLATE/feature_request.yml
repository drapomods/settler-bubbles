name: Feature request
description: Suggest a dialogue, visual, compatibility or settings improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Dialogue and situations
        - Bubble visuals
        - Compatibility or Java API
        - Settings and controls
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
      description: Explain the situation or limitation behind the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how you would like it to work in Necesse.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Add optional examples, dialogue ideas or other solutions.
