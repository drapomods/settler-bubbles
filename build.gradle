plugins {
    id 'java'
}

project.ext.modID = 'drapomods.settlerbubbles'
project.ext.modName = 'Settler Bubbles'
project.ext.modVersion = '1.1.2'
project.ext.gameVersion = '1.3.2'
project.ext.modDescription = 'Speech bubbles inspired by RimWorld that make settlers and visitors feel alive.'
project.ext.author = 'DrapoMods'
project.ext.clientside = false

def configuredGameDirectory = providers.gradleProperty('necesseDir')
        .orElse(providers.environmentVariable('NECESSE_DIR'))
        .getOrNull()
def commonGameDirectories = [
        'C:/Program Files (x86)/Steam/steamapps/common/Necesse',
        'C:/Program Files/Steam/steamapps/common/Necesse'
]
def gameDirectory = configuredGameDirectory ?: commonGameDirectories.find {
    file("${it}/Necesse.jar").exists()
}

if (gameDirectory == null) {
    throw new GradleException('Could not find Necesse. Set necesseDir in gradle.properties, pass -PnecesseDir=..., or set NECESSE_DIR.')
}

def buildLocation = 'build/jar/'
def jarName = "${project.ext.modName.replace(' ', '')}-${project.ext.gameVersion}-${project.ext.modVersion}"

group = project.ext.modID
version = project.ext.modVersion

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

configurations {
    libDepends
}

sourceSets.main.output.resourcesDir = file('build/mod/resources/')
sourceSets.main.java.getDestinationDirectory().set(file('build/mod/'))
sourceSets.main.compileClasspath += configurations.libDepends

compileJava.options.encoding = 'UTF-8'
compileJava.options.compilerArgs += ['-Xlint:deprecation']

if (!file(gameDirectory + '/Necesse.jar').exists()) {
    throw new GradleException("Could not find Necesse.jar in ${gameDirectory}. Check necesseDir, -PnecesseDir, or NECESSE_DIR.")
}

dependencies {
    implementation files(gameDirectory + '/Necesse.jar')
    implementation fileTree(gameDirectory + '/lib/')
    implementation fileTree('./mods/')
}

tasks.register('createAppID') {
    group = 'necesse'
    description = 'Creates steam_appid.txt for development launches.'
    doLast {
        file('steam_appid.txt').text = '1169040'
    }
}

tasks.register('createModInfoFile', JavaExec) {
    group = 'necesse'
    description = 'Creates the generated mod.info file.'
    classpath = files(gameDirectory + '/Necesse.jar')
    getMainClass().set('CreateModInfoFile')
    args '-file', "${sourceSets.main.java.getClassesDirectory().get()}/mod.info",
            '-id', project.ext.modID,
            '-name', project.ext.modName,
            '-version', project.ext.modVersion,
            '-gameVersion', project.ext.gameVersion,
            '-description', project.ext.modDescription,
            '-author', project.ext.author,
            '-clientside', project.ext.clientside,
            '-dependencies', '',
            '-optionalDependencies', ''
}

classes.dependsOn('createModInfoFile')

tasks.register('preAntialiasTextures', JavaExec) {
    group = 'necesse'
    description = 'Pre-antialiases transparent texture edges.'
    classpath = files(gameDirectory + '/Necesse.jar')
    getMainClass().set('PreAntialiasTextures')
    args '-folders', sourceSets.main.resources.srcDirs.stream().map { it.path }.toArray().join(';')
}

def supportedLocaleCodes = ['en', 'pt-BR', 'de', 'es', 'fr', 'nl', 'pl', 'ru', 'zh-CN', 'ja', 'kr']

tasks.register('validateTranslations') {
    group = 'verification'
    description = 'Checks locale keys, values and replacement placeholders.'
    inputs.files(supportedLocaleCodes.collect { file("src/main/resources/locale/${it}.lang") })
    doLast {
        def parseLocale = { File localeFile ->
            if (!localeFile.exists()) {
                throw new GradleException("Missing locale file: ${localeFile.name}")
            }
            def entries = new LinkedHashMap<String, String>()
            def section = ''
            localeFile.readLines('UTF-8').eachWithIndex { line, index ->
                def trimmed = line.trim()
                if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                    return
                }
                if (trimmed.startsWith('[') && trimmed.endsWith(']')) {
                    section = trimmed.substring(1, trimmed.length() - 1)
                    return
                }
                int separator = line.indexOf('=')
                if (separator <= 0) {
                    throw new GradleException("Invalid locale line ${localeFile.name}:${index + 1}")
                }
                def key = section + '.' + line.substring(0, separator).trim()
                def value = line.substring(separator + 1).trim()
                if (value.isEmpty()) {
                    throw new GradleException("Empty translation for ${key} in ${localeFile.name}")
                }
                if (entries.put(key, value) != null) {
                    throw new GradleException("Duplicate translation key ${key} in ${localeFile.name}")
                }
            }
            return entries
        }

        def english = parseLocale(file('src/main/resources/locale/en.lang'))
        supportedLocaleCodes.findAll { it != 'en' }.each { code ->
            def translated = parseLocale(file("src/main/resources/locale/${code}.lang"))
            def missing = english.keySet() - translated.keySet()
            def extra = translated.keySet() - english.keySet()
            if (!missing.isEmpty() || !extra.isEmpty()) {
                throw new GradleException("Locale ${code} key mismatch. Missing: ${missing}; extra: ${extra}")
            }
            english.each { key, englishValue ->
                def expectedPlaceholders = (englishValue =~ /<[A-Za-z0-9_]+>/).findAll().sort()
                def actualPlaceholders = (translated[key] =~ /<[A-Za-z0-9_]+>/).findAll().sort()
                if (expectedPlaceholders != actualPlaceholders) {
                    throw new GradleException("Locale ${code} placeholder mismatch for ${key}: "
                            + "expected ${expectedPlaceholders}, found ${actualPlaceholders}")
                }
            }
        }
    }
}

tasks.named('processResources') {
    dependsOn 'validateTranslations'
}

tasks.register('runClient', JavaExec) {
    group = 'necesse'
    description = 'Builds and launches Necesse with Settler Bubbles.'
    dependsOn 'buildModJar', 'createAppID'
    classpath = files(gameDirectory + '/Necesse.jar')
    getMainClass().set('StartSteamClient')
    jvmArgs '-Xms512m', '-Xmx4G', '-XX:+UseG1GC'
    args '-dev', "-mod \"${buildLocation}\""
}

tasks.register('runDevClient', JavaExec) {
    group = 'necesse'
    description = 'Launches a second client for multiplayer testing.'
    dependsOn 'buildModJar', 'createAppID'
    classpath = files(gameDirectory + '/Necesse.jar')
    getMainClass().set('StartSteamClient')
    jvmArgs '-Xms512m', '-Xmx4G', '-XX:+UseG1GC'
    args '-dev 1', "-mod \"${buildLocation}\""
}

tasks.register('runServer', JavaExec) {
    group = 'necesse'
    description = 'Builds and launches a dedicated server with Settler Bubbles.'
    dependsOn 'buildModJar'
    classpath = files(gameDirectory + '/Server.jar')
    getMainClass().set('StartDesktopServer')
    jvmArgs '-Xms512m', '-Xmx4G', '-XX:+UseG1GC'
    args "-mod \"${buildLocation}\""
}

tasks.register('buildModJar', Jar) {
    group = 'necesse'
    description = 'Generates the distributable mod jar.'
    dependsOn 'classes', 'createModInfoFile'
    doFirst {
        fileTree(dir: buildLocation).exclude("${jarName}.jar").visit { details ->
            delete details.file
        }
    }
    from sourceSets.main.java.getClassesDirectory()
    from configurations.libDepends.collect { it.isDirectory() ? it : zipTree(it) }
    setArchiveFileName("${jarName}.jar")
    setDestinationDirectory(file(buildLocation))
}
